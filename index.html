<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>古代航海</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            display: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #hud {
            display: none;
            position: fixed;
            bottom: 16px;
            color: #665;
            font-size: 11px;
            text-align: center;
        }
        #loading {
            color: #555;
            font-size: 14px;
            text-align: center;
            line-height: 2;
        }
        #debug {
            display: none;
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.65);
            color: #c8e8ff;
            font-size: 12px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            padding: 8px 12px;
            line-height: 1.5;
            white-space: pre;
            border: 1px solid rgba(200, 230, 255, 0.25);
            border-radius: 3px;
            pointer-events: none;
        }
        #canvas-wrap {
            position: relative;
        }
        #gameui {
            display: none;
            position: absolute;
            top: 12px;
            left: 12px;
            color: #e8e4d0;
            font-size: 16px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 3px;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div id="loading">지형 데이터 로딩 중...</div>
<div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="gameui"></div>
</div>
<div id="hud">W·S 돛 펼침/접음 │ A·D 조타</div>
<div id="debug"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
