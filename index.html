<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>古代航海</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            display: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* 로딩 / 시작 메뉴 — 흑단 + 양피지 톤. */
        #loading, #start-menu {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #d4c098;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            text-align: center;
            user-select: none;
        }
        #start-menu { display: none; z-index: 10; }
        .title-main {
            font-size: 56px;
            letter-spacing: 12px;
            color: #d4c098;
            margin-left: 12px; /* letter-spacing 보정 */
            font-weight: normal;
        }
        .title-sub {
            font-size: 24px;
            letter-spacing: 8px;
            color: #a8a070;
            margin: 8px 0 24px 8px;
        }
        .title-blurb {
            font-size: 12px;
            color: #7a7058;
            line-height: 1.7;
            max-width: 360px;
            margin-bottom: 36px;
        }
        .loading-msg {
            font-size: 12px;
            color: #555;
            margin-top: 28px;
            line-height: 1.8;
        }
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 32px;
        }
        .menu-btn {
            min-width: 200px;
            padding: 10px 24px;
            background: transparent;
            color: #d4c098;
            border: 1px solid rgba(212, 192, 152, 0.4);
            border-radius: 2px;
            font-family: inherit;
            font-size: 15px;
            letter-spacing: 4px;
            cursor: pointer;
        }
        .menu-btn:hover {
            background: rgba(212, 192, 152, 0.08);
            color: #f0e6c8;
            border-color: rgba(212, 192, 152, 0.7);
        }
        .menu-btn:active { background: rgba(212, 192, 152, 0.18); }
        .hint {
            font-size: 11px;
            color: #555;
            letter-spacing: 1px;
        }
        #debug {
            display: none;
            position: absolute;
            top: 48px;
            left: 12px;
            background: rgba(0, 0, 0, 0.65);
            color: #c8e8ff;
            font-size: 12px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            padding: 8px 12px;
            line-height: 1.5;
            border: 1px solid rgba(200, 230, 255, 0.25);
            border-radius: 3px;
            user-select: none;
        }
        #debug #debug-text {
            margin: 0;
            white-space: pre;
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
            color: inherit;
        }
        /* Time / Map 인라인 컨트롤 (toggle-ui 안). 디버그 패널 열림일 때만 노출. */
        .dbg-inline-sep {
            width: 1px;
            align-self: stretch;
            background: rgba(200, 230, 255, 0.25);
            margin: 0 4px;
        }
        .dbg-inline-row {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 2px;
            font-size: 11px;
            color: rgba(200, 230, 255, 0.8);
        }
        .dbg-inline-row .dbg-label {
            opacity: 0.8;
        }
        .dbg-inline-row .dbg-val {
            display: inline-block;
            min-width: 72px;
            font-variant-numeric: tabular-nums;
            color: #c8e8ff;
        }
        .dbg-btn {
            width: 28px;
            height: 16px;
            background: transparent;
            color: rgba(200, 230, 255, 0.6);
            border: 1px solid rgba(200, 230, 255, 0.25);
            border-radius: 2px;
            font-family: inherit;
            font-size: 10px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }
        .dbg-btn:hover {
            color: #c8e8ff;
            border-color: rgba(200, 230, 255, 0.45);
            background: rgba(200, 230, 255, 0.08);
        }
        .dbg-btn:active {
            background: rgba(200, 230, 255, 0.18);
        }
        /* 디버그 꺼진 상태에선 인라인 컨트롤 숨김 */
        #toggle-ui .dbg-inline-row,
        #toggle-ui .dbg-inline-sep { display: none; }
        #toggle-ui.debug-on .dbg-inline-row { display: flex; }
        #toggle-ui.debug-on .dbg-inline-sep { display: block; }
        #canvas-wrap {
            position: relative;
        }
        #gameui {
            display: none;
            position: absolute;
            top: 12px;
            right: 12px;
            color: #e8e4d0;
            font-size: 16px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            padding: 6px 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 3px;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
        /* 러더 UI: 우하단, 드래그 가능. */
        #rudder-ui {
            display: none;
            position: absolute;
            bottom: 24px;
            right: 12px;
            width: 200px;
            height: 28px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(200, 230, 255, 0.25);
            border-radius: 3px;
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
        }
        #rudder-ui .rudder-track {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: ew-resize;
        }
        #rudder-ui .rudder-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1px;
            height: 16px;
            background: rgba(200, 230, 255, 0.5);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #rudder-ui .rudder-handle {
            position: absolute;
            top: 3px;
            left: 50%;
            width: 10px;
            height: 22px;
            background: #c8e8ff;
            border: 1px solid rgba(0, 0, 0, 0.5);
            border-radius: 2px;
            transform: translateX(-50%);
            pointer-events: none;
        }
        /* 돛 UI: 3단 세그먼트 (DOWN/HALF/FULL). 우하단 러더 위. */
        #sail-ui {
            display: none;
            position: absolute;
            bottom: 60px;
            right: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(200, 230, 255, 0.25);
            border-radius: 3px;
            padding: 2px;
            gap: 2px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            user-select: none;
        }
        #sail-ui.ready { display: flex; }
        #sail-ui .sail-seg {
            width: 56px;
            height: 22px;
            background: transparent;
            color: rgba(200, 230, 255, 0.55);
            border: 1px solid transparent;
            border-radius: 2px;
            font-family: inherit;
            font-size: 11px;
            letter-spacing: 0.5px;
            cursor: pointer;
            padding: 0;
        }
        #sail-ui .sail-seg.active {
            background: rgba(200, 230, 255, 0.18);
            color: #c8e8ff;
            border-color: rgba(200, 230, 255, 0.35);
        }
        #sail-ui .sail-seg:hover:not(.active) {
            color: #e8f4ff;
        }
        /* 토글 아이콘 컨테이너 (공통). i: 우상단, ★: 우하단(돛 UI 위). */
        #toggle-ui, #sky-ui {
            display: none;
            position: absolute;
            gap: 2px;
            padding: 2px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(200, 230, 255, 0.25);
            border-radius: 3px;
            font-family: ui-monospace, Menlo, Consolas, monospace;
            user-select: none;
        }
        #toggle-ui { top: 12px; left: 12px; }
        #sky-ui    { bottom: 96px; right: 12px; }
        #toggle-ui.ready,
        #sky-ui.ready { display: flex; }
        #toggle-ui .btn-toggle,
        #sky-ui .btn-toggle {
            width: 28px;
            height: 24px;
            background: transparent;
            color: rgba(200, 230, 255, 0.55);
            border: 1px solid transparent;
            border-radius: 2px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #toggle-ui .btn-toggle.active,
        #sky-ui .btn-toggle.active {
            background: rgba(200, 230, 255, 0.18);
            color: #c8e8ff;
            border-color: rgba(200, 230, 255, 0.35);
        }
        #toggle-ui .btn-toggle:hover:not(.active),
        #sky-ui .btn-toggle:hover:not(.active) {
            color: #e8f4ff;
        }
        /* 음소거 버튼: active = "음소거 ON" → 흐리게 + 사선. */
        #btn-mute { position: relative; }
        #btn-mute.active {
            background: transparent;
            color: rgba(200, 230, 255, 0.3);
            border-color: transparent;
        }
        #btn-mute.active::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 5px;
            right: 5px;
            height: 1px;
            background: rgba(200, 230, 255, 0.5);
            transform: rotate(-22deg);
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="loading">
    <div class="title-main">탐라</div>
    <div class="title-sub">古代航海</div>
    <div class="loading-msg">지형 데이터 로딩 중…</div>
</div>
<div id="start-menu">
    <div class="title-main">탐라</div>
    <div class="title-sub">古代航海</div>
    <div class="title-blurb">서기 476년, 탐라가 백제에 조공한 그 무렵.<br>태양·별·바람·해류로만 방향을 가늠한다.</div>
    <div class="menu-list">
        <button class="menu-btn" data-act="start">항해 시작</button>
    </div>
    <div class="hint">화면을 누르면 시작</div>
</div>
<div id="canvas-wrap">
    <canvas id="c"></canvas>
    <canvas id="c3d"></canvas>
    <div id="debug">
        <pre id="debug-text"></pre>
    </div>
    <div id="gameui"></div>
    <div id="toggle-ui">
        <button class="btn-toggle" id="btn-debug" title="디버그 패널">i</button>
        <div class="dbg-inline-sep"></div>
        <div class="dbg-inline-row">
            <span class="dbg-label">Time</span>
            <span class="dbg-val" id="dbg-time-val"></span>
            <button class="dbg-btn" data-act="time-down" title="시간 감속">÷2</button>
            <button class="dbg-btn" data-act="time-up" title="시간 가속">×2</button>
        </div>
        <div class="dbg-inline-sep"></div>
        <div class="dbg-inline-row">
            <span class="dbg-label">Map</span>
            <span class="dbg-val" id="dbg-map-val"></span>
            <button class="dbg-btn" data-act="map-out" title="축소">−</button>
            <button class="dbg-btn" data-act="map-in" title="확대">+</button>
        </div>
    </div>
    <div id="sky-ui">
        <button class="btn-toggle" id="btn-sky" title="하늘보기">★</button>
        <button class="btn-toggle" id="btn-mute" title="음소거">音</button>
    </div>
    <div id="sail-ui">
        <button class="sail-seg" data-v="0">DOWN</button>
        <button class="sail-seg" data-v="0.5">HALF</button>
        <button class="sail-seg" data-v="1">FULL</button>
    </div>
    <div id="rudder-ui">
        <div class="rudder-track">
            <div class="rudder-center"></div>
            <div class="rudder-handle"></div>
        </div>
    </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
